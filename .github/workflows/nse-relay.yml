name: nse-relay
# Started by the tracker (workflow_dispatch) when its snapshot is older than 5 minutes, with GitHub's schedule as a
# backstop: read NSE's public announcement feeds and publish one JSON snapshot on the `nse-data` branch.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nse-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nse-relay
      - name: Previous snapshot
        run: |
          if git fetch -q --depth=1 origin nse-data 2>/dev/null; then git show origin/nse-data:latest.json > prev.json; else echo '{}' > prev.json; fi
      - name: Read NSE
        run: node nse-relay/relay.mjs --prev prev.json --out latest.json
      - name: Publish
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cp latest.json "$RUNNER_TEMP/pub/" && cd "$RUNNER_TEMP/pub"
          git init -q -b nse-data
          git config user.name "nse-relay"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -qm "NSE snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nse-data
