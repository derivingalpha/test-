<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Korean Linguist – Apply</title></head>
<body>
<div class="posting-header"><h2>Korean Linguist (Freelance)</h2></div>
<form action="/lever-submit" method="post" enctype="multipart/form-data">
  <ul>
    <li class="application-question"><label><div class="application-label">Resume/CV ✱</div><input type="file" name="resume" required></label></li>
    <li class="application-question"><label><div class="application-label">Full name ✱</div><input name="name" required></label></li>
    <li class="application-question"><label><div class="application-label">Email ✱</div><input type="email" name="email" required></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div><input name="phone"></label></li>
    <li class="application-question"><label><div class="application-label">Current location</div><input name="location"></label></li>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div><input name="urls[LinkedIn]"></label></li>
    <li class="application-question"><div class="application-label">Tell us about your interpreting experience ✱</div><textarea name="cards[a1][field0]" required></textarea></li>
    <li class="application-question"><div class="application-label">How did you hear about us?</div>
      <select name="cards[a1][field1]"><option value="">Select...</option><option>LinkedIn</option><option>Job board</option><option>Referral</option></select></li>
  </ul>
  <div class="h-captcha" data-size="invisible"></div>
  <button type="submit" class="template-btn-submit">Submit application</button>
</form>
</body>
</html>
