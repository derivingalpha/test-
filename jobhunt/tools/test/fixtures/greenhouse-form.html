<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply for Korean Interpreter</title>
<style>
  .field { margin: 12px 0; }
  .visually-hidden { position: absolute; left: -9999px; }
  [role=listbox] { border: 1px solid #999; padding: 4px; }
  [role=option] { padding: 4px; cursor: pointer; }
</style></head>
<body>
<h1>Korean Interpreter (Remote)</h1>
<form id="application_form" action="/submit" method="post" enctype="multipart/form-data">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" type="email" name="job_application[email]" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" type="tel" name="job_application[phone]"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" class="visually-hidden" type="file" name="job_application[resume]" required></div>
  <div class="field"><label for="q_linkedin">LinkedIn Profile</label><input id="q_linkedin" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="q_why">Why are you interested in this role? *</label><textarea id="q_why" name="job_application[answers_attributes][1][text_value]" required></textarea></div>
  <div class="field"><label for="q_country">Which country do you live in? *</label>
    <select id="q_country" name="job_application[answers_attributes][2][text_value]" required>
      <option value="">Please select</option><option>India</option><option>South Korea</option><option>United States</option>
    </select></div>
  <fieldset class="field"><legend>Do you have a wired headset and a quiet room? *</legend>
    <label><input type="radio" name="headset" value="yes" required> Yes</label>
    <label><input type="radio" name="headset" value="no"> No</label>
  </fieldset>
  <div class="field"><label id="lang_label">Korean proficiency *</label>
    <input id="lang" role="combobox" aria-labelledby="lang_label" aria-required="true" autocomplete="off">
    <input type="hidden" name="korean_level" id="korean_level">
    <div role="listbox" id="lang_list" hidden></div>
  </div>
  <div class="field"><label><input type="checkbox" name="consent" value="agreed" required> I agree to the privacy policy *</label></div>
  <button type="submit">Submit Application</button>
</form>
<script>
  const levels = ['Native', 'Fluent / Advanced', 'Intermediate', 'Basic'];
  const input = document.getElementById('lang');
  const list = document.getElementById('lang_list');
  function show(filter) {
    list.textContent = '';
    for (const l of levels.filter((x) => x.toLowerCase().includes((filter || '').toLowerCase()))) {
      const o = document.createElement('div');
      o.setAttribute('role', 'option');
      o.textContent = l;
      o.addEventListener('click', () => { input.value = l; document.getElementById('korean_level').value = l; list.hidden = true; });
      list.appendChild(o);
    }
    list.hidden = false;
  }
  input.addEventListener('click', () => show(''));
  input.addEventListener('input', () => show(input.value));
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') list.hidden = true; });
</script>
</body>
</html>
