<title>Samruddhi's Job Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a phone-first job desk. Sticky header, one column of cards, a bottom tab bar,
   and a full-height sheet for one job. Indigo (jjok / neel dye) is the accent; turmeric marks fit. */
:root {
  --paper: #f3f4f9;
  --surface: #ffffff;
  --sunk: #e9ebf4;
  --ink: #181b2d;
  --muted: #5b607e;
  --line: #d8dbe9;
  --indigo: #2a3a8f;
  --indigo-ink: #ffffff;
  --indigo-soft: #e2e6f8;
  --turmeric: #b36a07;
  --turmeric-soft: #fbecd2;
  --good: #1d7448;
  --good-soft: #dbf0e3;
  --warn: #9a5800;
  --warn-soft: #fcebcd;
  --bad: #ad2a22;
  --bad-soft: #f8e0dd;
  --shadow: 0 1px 2px rgba(24, 27, 45, .06), 0 4px 14px rgba(24, 27, 45, .05);
  --font-display: "Gowun Batang", "Noto Serif KR", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans KR", -apple-system, "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1226; --surface: #181c36; --sunk: #12152b; --ink: #e8eaf6; --muted: #a3a8c6; --line: #2b3056;
    --indigo: #9eadf6; --indigo-ink: #10132a; --indigo-soft: #232a57; --turmeric: #f0b14f; --turmeric-soft: #3a2b10;
    --good: #72d6a2; --good-soft: #163a29; --warn: #f2b65c; --warn-soft: #3b2a0d; --bad: #f3918a; --bad-soft: #3f1a17;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1226; --surface: #181c36; --sunk: #12152b; --ink: #e8eaf6; --muted: #a3a8c6; --line: #2b3056;
  --indigo: #9eadf6; --indigo-ink: #10132a; --indigo-soft: #232a57; --turmeric: #f0b14f; --turmeric-soft: #3a2b10;
  --good: #72d6a2; --good-soft: #163a29; --warn: #f2b65c; --warn-soft: #3b2a0d; --bad: #f3918a; --bad-soft: #3f1a17;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--indigo); }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.runchip { font: 500 11.5px/1.2 var(--font-mono); color: var(--muted); text-align: right; }
.runchip b { display: block; color: var(--ink); font-weight: 500; }

main { padding-block: 18px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 22px; }
.eyebrow { font: 600 11.5px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.eyebrow .ko { text-transform: none; letter-spacing: 0; font-weight: 500; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 26px/1.2 var(--font-display); letter-spacing: -.015em; }
h2 { font: 700 20px/1.25 var(--font-display); }
h3 { font: 600 16px/1.3 var(--font-body); }
p { margin: 0; }
.muted { color: var(--muted); }
.section { display: grid; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--indigo); font-weight: 500; cursor: pointer; }

/* pipeline */
.pipeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 9px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.stat .n { font: 500 24px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); line-height: 1.25; }
.stat.hot { border-color: var(--warn); background: var(--warn-soft); }
.stat.hot .n { color: var(--warn); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.job { cursor: pointer; }
.job-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.fit { width: 50px; height: 50px; border-radius: 12px; display: grid; place-content: center; text-align: center; background: var(--sunk); color: var(--muted); }
.fit .n { font: 500 19px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.fit .l { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
.fit.hi { background: var(--turmeric-soft); color: var(--turmeric); }
.fit.mid { background: var(--indigo-soft); color: var(--indigo); }
.job-head { min-width: 0; display: grid; gap: 2px; }
.job-head h3 { overflow-wrap: anywhere; }
.co { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip.lang { font-family: var(--font-mono); font-size: 11px; background: var(--indigo-soft); color: var(--indigo); }
.why { font-size: 14px; }
.gaps { font-size: 13.5px; color: var(--warn); }
.gaps b { font-weight: 600; }
.next { font-size: 14px; background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.next b { color: var(--warn); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tone-accent { background: var(--indigo-soft); color: var(--indigo); }
.tone-info { background: var(--indigo-soft); color: var(--indigo); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-good { background: var(--good-soft); color: var(--good); }
.tone-bad { background: var(--bad-soft); color: var(--bad); }
.tone-muted { background: var(--sunk); color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.btn.primary { background: var(--indigo); border-color: var(--indigo); color: var(--indigo-ink); }
.btn.good { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; min-height: 32px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.danger { color: var(--bad); }
a.btn { color: var(--ink); }

/* rows (applications) */
.rows { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row .t { font-weight: 500; overflow-wrap: anywhere; }
.row .s { font-size: 13px; color: var(--muted); grid-column: 1; }
.row .pill { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
details.closed > summary { cursor: pointer; color: var(--muted); font-weight: 500; padding: 4px 0; }

/* filters */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.filter[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.filter .c { font-family: var(--font-mono); font-size: 11.5px; opacity: .75; margin-left: 4px; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tab { background: none; border: 0; display: grid; place-content: center; justify-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); cursor: pointer; position: relative; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--indigo); font-weight: 600; }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--warn); color: var(--surface); font: 600 10.5px/17px var(--font-mono); padding: 0 4px; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); }
.sheet-bar .wrap { display: flex; justify-content: space-between; align-items: center; padding-block: 8px; gap: 12px; }
.sheet .body { display: grid; gap: 18px; padding-block: 18px; }
.fitline { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.qa { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.qa:first-of-type { border-top: 0; padding-top: 0; }
.qa .q { font-weight: 600; font-size: 14px; }
.search { -webkit-appearance: none; appearance: none; }
textarea, input[type=text], input[type=url], input[type=search], select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.5; }
textarea { min-height: 120px; resize: vertical; }
textarea.short { min-height: 70px; }
label.field { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
label.field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.toggle { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.toggle input { width: 22px; height: 22px; accent-color: var(--indigo); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }
.timeline li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; }
.timeline time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty h3 { color: var(--ink); font-family: var(--font-display); font-size: 18px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.thinking { color: var(--muted); font-style: italic; }
.note { font-size: 13px; color: var(--muted); }
.confirm-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
@media (max-width: 380px) {
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet:not([hidden]) { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Samruddhi's Job Hunt<small>Remote roles · KO ⇄ EN · HI</small></div>
    <div class="runchip" id="runchip" aria-live="polite"></div>
  </div>
</header>
<main class="wrap"><div class="view" id="view"></div></main>
<nav class="tabs" aria-label="Sections">
  <div class="inner">
    <button class="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button class="tab" data-tab="matches"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Matches</button>
    <button class="tab" data-tab="applied"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Applications</button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </div>
</nav>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  'use strict';

  // ---------- state ----------
  const S = {
    jobs: new Map(), profile: null, prefs: null, lastRun: null, answers: [],
    tab: 'today', filter: 'all', openId: null,
    q: '', track: 'all', limit: 100, mq: '', mlimit: 40,
    packet: null, packetUnsub: null,
    ready: false, noDb: false, db: null, sample: null, canWrite: null, uid: null,
    readOnly: false, sheetDirty: false, viewDirty: false,
  };

  const STATUS = {
    new: { label: 'New match', tone: 'accent' },
    queued: { label: 'Assistant is on it', tone: 'info' },
    ready: { label: 'Needs you', tone: 'warn' },
    approved: { label: 'Submitting next run', tone: 'info' },
    applied: { label: 'Applied', tone: 'good' },
    interview: { label: 'Interview', tone: 'good' },
    offer: { label: 'Offer', tone: 'good' },
    rejected: { label: 'Not selected', tone: 'bad' },
    skipped: { label: 'Skipped', tone: 'muted' },
    closed: { label: 'Closed', tone: 'muted' },
  };
  const CATS = {
    interpreting: 'Interpreting', translation: 'Translation', localization: 'Subtitles & localization',
    'ai-training': 'AI training', operations: 'Operations', 'talent-pool': 'Talent pool',
  };
  const TABS = ['today', 'matches', 'applied', 'me'];

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
  const nowIso = () => new Date().toISOString();
  const fmtDate = (iso, withTime) => {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const o = { day: 'numeric', month: 'short' };
    if (withTime) Object.assign(o, { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleString('en-IN', o);
  };
  const ago = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return '';
    const m = Math.round((Date.now() - d) / 60000);
    if (m < 2) return 'just now';
    if (m < 60) return `${m} min ago`;
    const hr = Math.round(m / 60);
    if (hr < 24) return `${hr} h ago`;
    return `${Math.round(hr / 24)} d ago`;
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  };
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }
  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch {
      const ta = btn && btn.closest('.qa, .card, label')?.querySelector('textarea, input');
      if (ta) { ta.focus(); ta.select(); toast('Selected. Press copy on your keyboard.'); }
    }
  }
  const jobs = () => [...S.jobs.values()];
  const byStatus = (...st) => jobs().filter((j) => st.includes(j.status || 'new'));
  const fitClass = (n) => (n >= 80 ? 'hi' : n >= 65 ? 'mid' : '');

  // ---------- writes ----------
  const chains = new Map();
  function writeDoc(path, fn) {
    // one write at a time per document
    const prev = chains.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    chains.set(path, next);
    return next.catch((e) => {
      if (e && e.code === 'invalid_argument') { S.readOnly = true; toast('This board is view-only for you. Ask for Editor access to make changes.'); render(); }
      else if (e && e.code === 'quota_exceeded') toast('The board is full. Delete old skipped jobs to make room.');
      else toast('Could not save. Check your connection and try again.');
      throw e;
    });
  }
  const updateJob = (id, patch) => writeDoc(`jobs/${id}`, () => S.db.doc(`jobs/${id}`).update({ ...patch, updatedAt: nowIso() }));
  function setStatus(job, status, extra = {}, msg) {
    const history = (Array.isArray(job.history) ? job.history : []).slice(-40);
    history.push({ status, at: nowIso(), by: 'you' });
    return updateJob(job.id, { status, history, ...extra }).then(() => msg && toast(msg));
  }
  const canAct = () => !!S.db && !S.readOnly && S.canWrite !== false;

  // ---------- AI drafting ----------
  function facts() {
    const p = S.profile || {};
    const pr = S.prefs || {};
    const lines = [];
    lines.push(`Name: ${p.name || 'Samruddhi Singh'}`);
    if (p.headline) lines.push(`Headline: ${p.headline}`);
    if (p.summary) lines.push(`Summary: ${p.summary}`);
    if (p.languages) lines.push(`Languages: ${p.languages.join('; ')}`);
    if (p.education) lines.push(`Education: ${p.education.join('; ')}`);
    for (const x of p.experience || []) lines.push(`Experience: ${x.role} at ${x.org} (${x.dates}, ${x.location}). ${(x.bullets || []).join(' ')}`);
    if (p.skills) lines.push(`Skills: ${p.skills.join(', ')}`);
    const pref = [
      `Kind of work: ${pr.engagement || 'Open to full-time, part-time, contract and freelance work'}`,
      pr.rateUsd && `Expected rate: ${pr.rateUsd}`, pr.hoursPerWeek && `Hours per week: ${pr.hoursPerWeek}`,
      pr.availableFrom && `Available from: ${pr.availableFrom}`, pr.nightShifts && `US/night shifts: ${pr.nightShifts}`,
      pr.equipment && `Equipment: ${pr.equipment}`, pr.workAuth && `Location & work status: ${pr.workAuth}`,
      pr.notes && `Other notes from her: ${pr.notes}`,
    ].filter(Boolean);
    if (pref.length) lines.push(`Her own answers: ${pref.join('; ')}`);
    return lines.join('\n');
  }
  function jobContext(job) {
    if (!job) return 'No specific job.';
    return [`Role: ${job.title}`, `Company: ${job.company}`, job.category && `Type of work: ${CATS[job.category] || job.category}`,

  }
  function confirmed(btn) {
    if (btn.dataset.armed) { delete btn.dataset.armed; return true; }
    btn.dataset.armed = '1';
    btn.textContent = 'Has [[placeholders]]. Save anyway?';
    setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = 'Save for reuse'; } }, 4000);
    return false;
  }

  function savedAnswers() {
    if (!S.answers.length) return null;
    return h('div', { class: 'card' }, h('h3', { text: 'Your saved answers' }),
      S.answers.map((a) => h('div', { class: 'qa' }, h('p', { class: 'q', text: a.q }), h('p', { text: a.a }),
        h('div', { class: 'actions' }, h('button', { class: 'btn small', onclick: (e) => copy(a.a, e.currentTarget) }, 'Copy'),
          canAct() && h('button', { class: 'btn small ghost danger', onclick: (e) => {
            const b = e.currentTarget;
            if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to delete'; return; }
            S.db.doc(`answers/${a.id}`).delete().then(() => toast('Deleted')).catch(() => toast('Could not delete.'));
          } }, 'Delete')))));
  }

  // ---------- job sheet ----------
  function openJob(id) {
    S.openId = id;
    S.packet = null;
    if (S.packetUnsub) S.packetUnsub();
    S.packetUnsub = S.db ? S.db.doc(`packets/${id}`).onSnapshot((d) => { S.packet = d.exists ? d.data() : null; schedule(); }, () => {}) : null;
    renderSheet();
    const sh = $('#sheet');
    sh.hidden = false;
    sh.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('#sheet-close')?.focus(), 30);
  }
  function closeJob() {
    S.openId = null;
    if (S.packetUnsub) { S.packetUnsub(); S.packetUnsub = null; }
    S.packet = null;
    $('#sheet').hidden = true;
    document.body.style.overflow = '';
    S.sheetDirty = false;
    render();
  }

  function statusActions(j) {
    if (!canAct()) return null;
    const st = j.status || 'new';
    const b = (label, cls, fn) => h('button', { class: `btn ${cls || ''}`, onclick: fn }, label);
    const canAuto = j.autoApply !== 'no';
    switch (st) {
      case 'new': return h('div', { class: 'actions' },
        b('Apply for me', 'primary', () => setStatus(j, 'queued', {}, 'Queued. The assistant will apply on its next run.')),
        b('Not for me', 'ghost', () => setStatus(j, 'skipped', {}, 'Skipped')));
      case 'queued': return h('div', { class: 'actions' }, h('p', { class: 'note', text: 'The assistant picks this up on its next run.' }),
        b('Cancel', 'ghost', () => setStatus(j, 'new', {}, 'Moved back to Matches')));
      case 'ready': return h('div', { class: 'actions' },
        canAuto && b('Submit for me', 'primary', () => setStatus(j, 'approved', {}, 'Approved. It will be submitted on the next run.')),
        b('I applied myself', canAuto ? '' : 'primary', () => setStatus(j, 'applied', { appliedAt: nowIso(), appliedBy: 'you' }, 'Marked as applied')),
        b('Not for me', 'ghost', () => setStatus(j, 'skipped', {}, 'Skipped')));
      case 'approved': return h('div', { class: 'actions' }, h('p', { class: 'note', text: 'Will be submitted on the next run.' }),
        b('Cancel', 'ghost', () => setStatus(j, 'ready', {}, 'Cancelled. Nothing was sent.')));
      case 'applied': return h('div', { class: 'actions' },
        b('Got an interview', 'good', () => setStatus(j, 'interview', {}, 'Good luck!')),
        b('Not selected', 'ghost', () => setStatus(j, 'rejected', {}, 'Updated')));
      case 'interview': return h('div', { class: 'actions' },
        b('Got an offer', 'good', () => setStatus(j, 'offer', {}, 'Congratulations!')),
        b('Not selected', 'ghost', () => setStatus(j, 'rejected', {}, 'Updated')));
      default: return h('div', { class: 'actions' }, b('Move back to Matches', 'ghost', () => setStatus(j, 'new', {}, 'Moved back to Matches')));
    }
  }

  function packetSection(j) {
    const pk = S.packet || {};
    const answers = Array.isArray(pk.answers) ? pk.answers : [];
    const wrap = h('div', { class: 'card' }, eyebrow('Application answers', '지원서 답변'));
    const savePacket = (patch) => writeDoc(`packets/${j.id}`, () => S.db.doc(`packets/${j.id}`).set({ ...(S.packet || {}), ...patch, editedAt: nowIso() })).then(() => toast('Saved'));

    if (!answers.length && !pk.coverLetter && !pk.email) {
      wrap.append(h('p', { class: 'muted', text: (j.status || 'new') === 'new' || j.status === 'queued'
        ? 'The assistant writes these when it prepares the application. You can also draft one yourself below.'
        : 'No answers were needed for this one.' }));
    }
    if (pk.email) {
      const e = pk.email;
      wrap.append(h('div', { class: 'qa' }, h('p', { class: 'q', text: 'Send this email from your own inbox' }),
        h('dl', { class: 'kv' }, h('dt', { text: 'To' }), h('dd', { text: e.to || '' }), h('dt', { text: 'Subject' }), h('dd', { text: e.subject || '' })),
        h('textarea', { readonly: true, value: e.body || '' }),
        h('div', { class: 'actions' },
          h('button', { class: 'btn small', onclick: (ev) => copy(e.to || '', ev.currentTarget) }, 'Copy address'),
          h('button', { class: 'btn small', onclick: (ev) => copy(e.subject || '', ev.currentTarget) }, 'Copy subject'),
          h('button', { class: 'btn small', onclick: (ev) => copy(e.body || '', ev.currentTarget) }, 'Copy email')),
        h('p', { class: 'note', text: 'Attach your CV before sending.' })));
    }
    const coverTa = h('textarea', { value: pk.coverLetter || '', placeholder: 'No cover letter yet.', readonly: !canAct(), onfocus: () => { S.sheetDirty = true; },
      onblur: (e) => { if (canAct() && e.target.value !== (pk.coverLetter || '')) savePacket({ coverLetter: e.target.value }); } });
    if (pk.coverLetter || canAct()) {
      wrap.append(h('div', { class: 'qa' }, h('p', { class: 'q', text: 'Cover letter' }), coverTa,
        h('div', { class: 'actions' },
          h('button', { class: 'btn small', onclick: (e) => coverTa.value && copy(coverTa.value, e.currentTarget) }, 'Copy'),
          canAct() && h('button', { class: 'btn small', onclick: async (e) => {
            const t = await draftInto(coverTa, '', j, coverTa.value.trim() ? 'improve' : 'cover', e.currentTarget);
            if (t) savePacket({ coverLetter: t });
          } }, pk.coverLetter ? 'Improve with Claude' : 'Draft with Claude'))));
    }
    answers.forEach((qa, i) => {
      const ta = h('textarea', { value: qa.a || '', readonly: !canAct(), class: (qa.a || '').length < 140 ? 'short' : '', onfocus: () => { S.sheetDirty = true; },
        onblur: (e) => {
          if (!canAct() || e.target.value === (qa.a || '')) return;
          const next = answers.map((x, k) => (k === i ? { ...x, a: e.target.value } : x));
          savePacket({ answers: next });
        } });
      wrap.append(h('div', { class: 'qa' }, h('p', { class: 'q', text: qa.q }), ta,
        /\[\[/.test(qa.a || '') && h('p', { class: 'gaps', text: 'Fill in the [[placeholders]] before this is sent.' }),
        h('div', { class: 'actions' },
          h('button', { class: 'btn small', onclick: (e) => copy(ta.value, e.currentTarget) }, 'Copy'),
          canAct() && h('button', { class: 'btn small', onclick: async (e) => {
            const t = await draftInto(ta, qa.q, j, 'improve', e.currentTarget);
            if (t) savePacket({ answers: answers.map((x, k) => (k === i ? { ...x, a: t } : x)) });
          } }, 'Improve'),
          canAct() && h('button', { class: 'btn small', onclick: async (e) => {
            const t = await draftInto(ta, qa.q, j, 'shorter', e.currentTarget);
            if (t) savePacket({ answers: answers.map((x, k) => (k === i ? { ...x, a: t } : x)) });
          } }, 'Shorter'))));
    });
    if (canAct()) {
      const nq = h('input', { type: 'text', placeholder: 'Another question from this form', onfocus: () => { S.sheetDirty = true; } });
      const na = h('textarea', { class: 'short', placeholder: 'Draft appears here' });
      wrap.append(h('div', { class: 'qa' }, h('p', { class: 'q', text: 'Add a question' }), nq,
        h('div', { class: 'actions' }, h('button', { class: 'btn small primary', onclick: async (e) => {
          if (!nq.value.trim()) { nq.focus(); return; }
          const t = await draftInto(na, nq.value.trim(), j, 'draft', e.currentTarget);
          if (t) savePacket({ answers: [...answers, { q: nq.value.trim(), a: t }] });
        } }, 'Draft & add')), na));
    }
    return wrap;
  }

  function renderSheet() {
    const j = S.jobs.get(S.openId);
    const sh = $('#sheet');
    sh.textContent = '';
    if (!j) { sh.append(h('div', { class: 'wrap body' }, emptyState('This job was removed', ''), h('button', { class: 'btn', onclick: closeJob }, 'Back'))); return; }
    const url = safeUrl(j.url), applyUrl = safeUrl(j.applyUrl);
    const notes = h('textarea', { class: 'short', value: j.notes || '', placeholder: 'Recruiter name, interview date, anything to remember', readonly: !canAct(), onfocus: () => { S.sheetDirty = true; },
      onblur: (e) => { if (canAct() && e.target.value !== (j.notes || '')) updateJob(j.id, { notes: e.target.value }).then(() => toast('Saved')); } });
    const hist = (Array.isArray(j.history) ? j.history : []).slice().reverse();
    sh.append(
      h('div', { class: 'sheet-bar' }, h('div', { class: 'wrap' },
        h('button', { class: 'btn small ghost', id: 'sheet-close', onclick: closeJob }, '← Back'), pill(j.status))),
      h('div', { class: 'wrap body' },
        h('div', { class: 'section' },
          h('div', { class: 'fitline' }, fitBox(j.fit), h('div', { class: 'job-head' }, h('h2', { id: 'sheet-title', text: j.title }), h('p', { class: 'co', text: j.company }))),
          chipsFor(j)),
        j.status === 'ready' && j.nextStep && h('p', { class: 'next' }, h('b', { text: 'Next step: ' }), j.nextStep),
        statusActions(j),
        h('div', { class: 'actions' },
          url && h('a', { class: 'btn small', href: url, target: '_blank', rel: 'noopener' }, 'Open listing ↗'),
          applyUrl && applyUrl !== url && h('a', { class: 'btn small', href: applyUrl, target: '_blank', rel: 'noopener' }, 'Open application ↗')),
        h('div', { class: 'card' },
          j.why && h('p', { class: 'why' }, h('b', { text: 'Why it fits: ' }), j.why),
          j.gaps && h('p', { class: 'gaps' }, h('b', { text: 'Watch for: ' }), j.gaps),
          j.summary && h('p', { class: 'muted', text: j.summary }),
          h('dl', { class: 'kv' },
            j.eligibilityNote && [h('dt', { text: 'Who can apply' }), h('dd', { text: j.eligibilityNote })],
            j.source && [h('dt', { text: 'Found on' }), h('dd', { text: j.source })],
            j.foundAt && [h('dt', { text: 'Found' }), h('dd', { text: fmtDate(j.foundAt) })],
            j.appliedAt && [h('dt', { text: 'Applied' }), h('dd', { text: `${fmtDate(j.appliedAt, true)}${j.appliedBy === 'assistant' ? ' by the assistant' : ''}` })],
            j.confirmation && [h('dt', { text: 'Confirmation' }), h('dd', { text: j.confirmation })])),
        packetSection(j),
        h('div', { class: 'card' }, h('h3', { text: 'Notes' }), notes),
        hist.length ? h('div', { class: 'card' }, h('h3', { text: 'History' }),
          h('ul', { class: 'timeline' }, hist.map((x) => h('li', {}, h('time', { text: fmtDate(x.at, true) }),
            h('span', {}, (STATUS[x.status] || {}).label || x.status, x.by === 'assistant' ? ' · assistant' : '', x.note ? ` — ${x.note}` : ''))))) : null));
  }

  // ---------- shell ----------
  function go(tab) {
    if (!TABS.includes(tab)) tab = 'today';
    S.tab = tab;
    store.set('jh.tab', tab);
    try { history.replaceState(null, '', `#${tab}`); } catch { /* sandboxed */ }
    render();
    window.scrollTo(0, 0);
  }
  function renderRunChip() {
    const c = $('#runchip');
    c.textContent = '';
    if (S.noDb) return;
    if (S.lastRun && S.lastRun.at) c.append(h('b', { text: 'Checked' }), ago(S.lastRun.at));
  }
  function render() {
    const view = $('#view');
    view.textContent = '';
    if (S.noDb) {
      view.append(h('div', { class: 'view' }, h('div', { class: 'section' }, eyebrow('Welcome', '환영합니다'), h('h1', { text: 'Sign in to see your job board' })),
        emptyState('Your board is private', 'Open this link while signed in to Claude with the email it was shared with. If it still doesn’t load, ask the person who shared it to invite you as an Editor.')));
    } else {
      const fn = { today: viewToday, matches: viewMatches, applied: viewApplied, me: viewMe }[S.tab];
      view.append(fn());
      if (S.readOnly || S.canWrite === false) view.prepend(h('p', { class: 'next', text: 'You can view this board. To approve applications, ask for Editor access.' }));
    }
    for (const t of document.querySelectorAll('.tab')) {
      t.toggleAttribute('aria-current', false);
      if (t.dataset.tab === S.tab) t.setAttribute('aria-current', 'page');
      t.querySelector('.badge')?.remove();
      const n = t.dataset.tab === 'applied' ? byStatus('ready').length : t.dataset.tab === 'matches' ? byStatus('new').length : 0;
      if (n) t.append(h('span', { class: 'badge', text: n > 99 ? '99+' : n }));
    }
    renderRunChip();
  }
  let pending = false;
  const editingIn = (root) => {
    const a = document.activeElement;
    return a && root.contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) ? a : null;
  };
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      // Never rebuild a form under her fingers: refresh just the list, or wait for blur.
      const typing = editingIn($('#view'));
      if (typing && typing.id === 'q') refreshTracker();
      else if (typing && typing.id === 'mq') refreshMatches();
      else if (typing) S.viewDirty = true;
      else render();
      if (typing) { renderRunChip(); }
      if (S.openId) {
        const a = document.activeElement;
        const editing = a && $('#sheet').contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
        if (!editing) renderSheet();
      }
    });
  }

  for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => go(t.dataset.tab));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.openId) closeJob(); });
  $('#sheet').addEventListener('focusout', () => { setTimeout(() => { if (S.openId && !$('#sheet').contains(document.activeElement)) schedule(); }, 50); });
  $('#view').addEventListener('focusout', () => { setTimeout(() => { if (S.viewDirty && !editingIn($('#view'))) { S.viewDirty = false; schedule(); } }, 50); });

  const fromHash = (location.hash || '').replace('#', '');
  S.tab = TABS.includes(fromHash) ? fromHash : (TABS.includes(store.get('jh.tab')) ? store.get('jh.tab') : 'today');
  S.filter = store.get('jh.filter') || 'all';
  S.track = TRACK[store.get('jh.track')] ? store.get('jh.track') : 'all';
  render();

  // ---------- data ----------
  (async () => {
    if (!window.claude || typeof window.claude.use !== 'function') { S.noDb = true; render(); return; }
    const db = await window.claude.use('db');
    if (!db) { S.noDb = true; render(); return; }
    S.db = db;
    const fail = (e) => { if (e && e.code === 'revoked') { S.noDb = true; } schedule(); };
    // The 1000 most recently touched jobs: the live board plus recent history.
    db.collection('jobs').orderBy('updatedAt', 'desc').limit(1000).onSnapshot((snap) => {
      S.jobs = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      S.ready = true;
      schedule();
    }, fail);
    db.doc('settings/profile').onSnapshot((d) => { S.profile = d.exists ? d.data() : null; schedule(); }, fail);
    db.doc('settings/preferences').onSnapshot((d) => { S.prefs = d.exists ? d.data() : null; schedule(); }, fail);
    db.collection('runs').orderBy('at', 'desc').limit(1).onSnapshot((snap) => { S.lastRun = snap.empty ? null : snap.docs[0].data(); schedule(); }, fail);
    db.collection('answers').onSnapshot((snap) => { S.answers = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''))); schedule(); }, fail);
    const user = await window.claude.use('user');
    if (user) { S.canWrite = await user.can('data.write'); S.uid = await user.id(); }
    S.sample = await window.claude.use('sample');
    schedule();
  })();
})();
</script>
